# =============================================================================
# Upstream Discourse release check + published-image check
# =============================================================================
# Runs daily.
#
# check: compares the DISCOURSE_VERSION pinned in docker/Dockerfile with the
# newest upstream tag of the same track -- stable releases (vYYYY.M.P) when a
# stable tag is pinned, `v*-latest*` when a -latest tag is pinned. If upstream
# is newer and no open issue already tracks it, opens a `discourse-release`
# issue. Purely informational -- the bump itself stays manual.
#
# image-published: fails (and opens an `image-missing` issue) when the newest
# docker/v* tag has no multi-arch manifest in GHCR, i.e. the release build
# broke (e.g. the Trivy gate) and nothing deployable was published.
# =============================================================================

name: Upstream check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare pinned vs upstream
        id: cmp
        run: |
          pinned="$(grep -oP 'ARG DISCOURSE_VERSION=\K\S+' docker/Dockerfile)"
          if [[ "${pinned}" == *-latest* ]]; then
            track='^v[0-9]+\.[0-9]+\.[0-9]+-latest(\.[0-9]+)?$'
          else
            track='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          upstream="$(git ls-remote --tags https://github.com/discourse/discourse 'refs/tags/v*' \
            | awk '{print $2}' | grep -v '\^{}$' | sed 's#refs/tags/##' | grep -E "${track}" | sort -V | tail -n1)"
          echo "pinned=${pinned}"
          echo "upstream=${upstream}"
          {
            echo "pinned=${pinned}"
            echo "upstream=${upstream}"
            echo "outdated=$([ "${pinned}" != "${upstream}" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Open issue if missing
        if: steps.cmp.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PINNED: ${{ steps.cmp.outputs.pinned }}
          UPSTREAM: ${{ steps.cmp.outputs.upstream }}
        run: |
          title="Discourse ${UPSTREAM} released (pinned: ${PINNED})"
          gh label create discourse-release --color 0E8A16 --force \
            --description "New upstream Discourse tag available"
          if gh issue list --state open --label discourse-release --search "\"${UPSTREAM}\" in:title" \
               --json number --jq 'length' | grep -qv '^0$'; then
            echo "Issue for ${UPSTREAM} already open, skipping"
            exit 0
          fi
          gh issue create --title "${title}" --label discourse-release --body "$(cat <<MD
          Upstream tag: https://github.com/discourse/discourse/releases/tag/${UPSTREAM}
          Compare: https://github.com/discourse/discourse/compare/${PINNED}...${UPSTREAM}

          Pinned in \`docker/Dockerfile\` (\`ARG DISCOURSE_VERSION\`) and \`chart/Chart.yaml\` (\`appVersion\`): \`${PINNED}\`

          Opened automatically by \`.github/workflows/upstream-check.yml\`.
          MD
          )"

  image-published:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      packages: read
      actions: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify newest docker/v* tag has a multi-arch image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/discourse-k8s
        run: |
          set -euo pipefail
          tag="$(git ls-remote --tags "https://github.com/${GH_REPO}" 'refs/tags/docker/v*' \
            | awk '{print $2}' | grep -v '\^{}$' | sed 's#refs/tags/##' | sort -V | tail -n1)"
          version="${tag#docker/}"
          echo "newest image tag: ${tag}"

          # A release build takes ~20 min; don't flag one that is still running.
          status="$(gh run list --workflow docker.yml --branch "${tag}" --limit 1 --json status --jq '.[0].status // "none"')"
          if [[ "${status}" != "completed" && "${status}" != "none" ]]; then
            echo "Docker workflow for ${tag} is ${status}, skipping"
            exit 0
          fi

          arches="$(docker buildx imagetools inspect --raw "${IMAGE}:${version}" 2>/dev/null \
            | jq -r '[.manifests[]?.platform.architecture] | sort | join(",")' || true)"
          echo "architectures: ${arches:-<none>}"
          if [[ "${arches}" == *amd64* && "${arches}" == *arm64* ]]; then
            exit 0
          fi

          echo "::error::${IMAGE}:${version} has no multi-arch manifest (got: '${arches:-none}')"
          gh label create image-missing --color B60205 --force \
            --description "A docker/v* tag has no published multi-arch image"
          title="Image ${version} was never published (tag ${tag})"
          if ! gh issue list --state open --label image-missing --search "\"${version}\" in:title" \
               --json number --jq 'length' | grep -qv '^0$'; then
            gh issue create --title "${title}" --label image-missing --body "$(cat <<MD
          \`${tag}\` exists but \`${IMAGE}:${version}\` has no multi-arch manifest (found: \`${arches:-none}\`).
          The release build most likely failed (build or Trivy gate), so the manifest job never ran.

          Docker workflow runs for this tag: https://github.com/${GH_REPO}/actions/workflows/docker.yml?query=branch%3A${tag}

          Opened automatically by \`.github/workflows/upstream-check.yml\`.
          MD
          )"
          fi
          exit 1
